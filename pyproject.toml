[project]
name = "congolangatlas-data"
version = "0.1.0"
description = "Validation and publication-safety tooling for CongoLangAtlas metadata"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.18,<5",
  "shapely>=2.0,<3",
]

[project.scripts]
validate-catalog = "scripts.validate_catalog:main"
validate-geodata = "scripts.validate_geodata:main"
validate-reviews = "scripts.validate_reviews:main"
build-geodata = "scripts.build_geodata:main"
import-congolangbench = "scripts.import_congolangbench:main"
build-import-review-queue = "scripts.build_import_review_queue:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
